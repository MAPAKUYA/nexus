name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly: catches newly published advisories

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Config files must be UTF-8 without BOM
        shell: bash
        run: |
          bad=0
          for f in package.json tsconfig.json Cargo.toml src-tauri/Cargo.toml src-tauri/tauri.conf.json crates/nexus-core/Cargo.toml; do
            if [ "$(head -c3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              echo "::error file=$f::File has a BOM (Byte Order Mark). Re-save it as UTF-8 without BOM."
              bad=1
            fi
          done
          exit $bad

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: cargo test --locked -p nexus-core
      - name: Build the app (no installer)
        run: npm run tauri build -- --no-bundle

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
      - run: npm ci
      - run: npm audit --audit-level=high
