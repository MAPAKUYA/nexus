[package]
name = "nexus-core"
version = "1.0.1"
license = "GPL-3.0-only"
authors = ["MAPAKUYA"]
edition = "2021"
description = "NEXUS: платформонезависимое ядро учёта времени и хранилище SQLite"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
